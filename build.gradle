plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Any warning is a build failure. "processing" is excluded because the Mixin annotation
    // processor emits notes we do not control; everything else must be fixed in source.
    options.compilerArgs << '-Xlint:all' << '-Xlint:-processing' << '-Werror'
}

// Byte-for-byte reproducible archives.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    dirMode = 0755
    fileMode = 0644
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        // End-to-end proof that the miner works: builds a scenario in a real world, runs the
        // glitch and logs a verdict. Driven by scripts/selftest.sh.
        selfTest {
            client()
            systemProperty 'badghost.selftest', 'true'
            programArguments.addAll '--quickPlaySingleplayer', project.findProperty('selftest_world') ?: 'New World'
        }

        // Retained for parity with the MDK; the mod itself is client-only and no-ops here.
        server {
            server()
            programArgument '--nogui'
        }

        // A real dedicated server for the network-path self-test. The mod is client-only, so it
        // does not load here — which is exactly what "the server knows nothing" must mean.
        selfTestServer {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run-server')
        }

        // A client that connects to that dedicated server over a real socket and runs the same
        // self-test scenarios, proving the prediction/sequence path across the network.
        selfTestMp {
            client()
            gameDirectory = project.file('run-mp')
            programArguments.addAll '--quickPlayMultiplayer', '127.0.0.1:25565'
            systemProperty 'badghost.selftest', 'true'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // JUnit 5 against a bootstrapped Minecraft runtime; see src/test/java.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
}

// The self-test harness drives a live client; it has no business in a shipped artifact.
tasks.named('jar', Jar) {
    exclude 'red/team/badghost/dev/**'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
